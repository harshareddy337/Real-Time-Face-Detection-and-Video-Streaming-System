<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AI Face Detection System</title>

    <!-- Favicon -->
    <link rel="icon" href="data:," />

    <!-- Meta -->
    <meta name="description" content="Real-Time Face Detection using FastAPI, WebSockets and React" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Basic Styling (fallback before React loads) -->
    <style>
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #0f172a;
        color: white;
      }

      #root {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .loader {
        font-size: 18px;
        color: #38bdf8;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
      <div class="loader">Loading AI System...</div>
    </div>
  </body>
</html>
